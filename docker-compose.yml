services:
  plotterfun-node-editor:
    image: ${IMAGE_REF:-docker.io/andpra70/plotterfun-node-editor:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plotterfun-node-editor
    restart: unless-stopped
    network_mode: host
    environment:
      APP_PORT: ${HOST_PORT:-8080}
      KLEIN_HOST: ${KLEIN_HOST:-192.168.1.127}
      KLEIN_PORT: ${KLEIN_PORT:-8000}
